name: orbit-test

x-test-env: &test-env
  ENVIRONMENT: test
  DEBUG: True

  DB_NAME: test_db
  DB_USER: orbit_test
  DB_PASSWORD: ${DB_PASSWORD:-test_password}
  DB_HOST: db
  DB_PORT: "5432"

  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-test_admin_password}

  SECRET_KEY: test-only-secret-key
  ORBIT_ANONYMIZATION_SECRET: test-only-orbit-anonymization-secret-2026
  ORBIT_AUTH_SECRET: test-only-orbit-auth-super-secret-2026
  ENABLE_DEBUG_ROUTES: ${ENABLE_DEBUG_ROUTES:-false}
  METRICS_ENABLED: ${METRICS_ENABLED:-1}

  VITE_API_URL: http://localhost:8001

x-backend-bind: &backend-bind
  type: bind
  source: ./backend
  target: /app
  bind:
    selinux: z

services:
  db:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_DB: test_db
      POSTGRES_USER: ${POSTGRES_USER-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-test_admin_password}
      
    # Run Postgres entirely in RAM for faster migrations/tests and zero leftover state
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d test_db"]
      interval: 2s
      timeout: 2s
      retries: 10
    networks:
      - backend_net

  migration:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: dev
    environment:
      <<: *test-env
    volumes:
      - *backend-bind
    command:
      - sh
      - -c
      - >-
        alembic -c /app/alembic.ini upgrade head &&
        python -m scripts.provision_db_credentials &&
        python -m scripts.load_feature_flags &&
        python -m scripts.seed_db
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    networks:
      - backend_net

  backend-test:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: dev
    environment:
      <<: *test-env
    volumes:
      - *backend-bind
    command:
      - sh
      - -c
      - >-
        python -m scripts.load_feature_flags &&
        python -m scripts.seed_db &&
        pytest -v --tb=short
    depends_on:
      migration:
        condition: service_completed_successfully
    networks:
      - backend_net

  # Live FastAPI HTTP server for frontend/E2E integration tests
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: dev
    environment:
      <<: *test-env
    volumes:
      - *backend-bind
    command: ["fastapi", "run", "app/main.py", "--host", "0.0.0.0", "--port", "8001"]
    depends_on:
      backend-test:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/docs')"]
      interval: 2s
      timeout: 2s
      retries: 15
    networks:
      - backend_net

  # Runs frontend tests (can run isolated OR against http://backend:8001)
  frontend-test:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    environment:
      CI: "true"
      VITE_API_URL: http://localhost:8001
    volumes:
      - type: bind
        source: ./frontend
        target: /workspace
        bind:
          selinux: z
      - /workspace/node_modules
    command: ["pnpm", "vitest", "run"]
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - backend_net

networks:
  backend_net:
    driver: bridge
