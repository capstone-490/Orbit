services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init.sh

  openfga-migrate:
    image: openfga/openfga:v1.5.0
    command: migrate
    environment:
      - OPENFGA_DATASTORE_ENGINE=postgres
      - OPENFGA_DATASTORE_URI=postgres://postgres:postgrespassword@postgres:5432/openfga?sslmode=disable
    depends_on:
      - postgres

  openfga:
    image: openfga/openfga:v1.5.0
    command: run
    environment:
      - OPENFGA_DATASTORE_ENGINE=postgres
      - OPENFGA_DATASTORE_URI=postgres://postgres:postgrespassword@postgres:5432/openfga?sslmode=disable
      - OPENFGA_PLAYGROUND_ENABLED=true
    ports:
      - "8080:8080" # HTTP API
      - "8081:8081" # gRPC API
      - "3000:3000" # Web Playground for testing
      - "2112:2112" # Prometheus metrics
    depends_on:
      openfga-migrate:
        condition: service_completed_successfully

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgrespassword@postgres:5432/advisor_app
      - FGA_API_URL=http://openfga:8080
    ports:
      - "8000:8000"
    depends_on:
      - openfga

volumes:
  pgdata:
