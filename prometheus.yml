global:
  scrape_interval: 15s

scrape_configs:
  - job_name: backend
    scrape_interval: 10s
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8001"]

  - job_name: node
    static_configs:
      - targets: ["node_exporter:9100"]
      
  - job_name: 'openfga'
    metrics_path: /metrics
    static_configs:
      - targets: ['openfga:2112']
