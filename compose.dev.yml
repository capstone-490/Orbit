x-backend-bind: &backend-bind
  type: bind
  source: ./backend
  target: /app
  bind:
    selinux: z

services:
  db:
    image: postgres:18.6-alpine3.24
    ports:
      - "127.0.0.1:5432:5432"
    volumes: !override
      - client_overview_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
  
  backend:
    build:
      target: dev
    command: ["fastapi", "dev", "app/main.py", "--host", "0.0.0.0", "--port", "8001"]
    env_file:
      - .env
    environment:
      ENVIRONMENT: dev
      DEBUG: "true"
      BACKEND_URL: http://127.0.0.1:8001
      DB_HOST: db
      DB_PORT: 5432
      CORS_ORIGINS: '["http://127.0.0.1:5173", "http://localhost:5173"]'
    ports:
      - "127.0.0.1:8001:8001"
    volumes:
      - *backend-bind
    depends_on:
      db:
        condition: service_healthy
  
  migration:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: dev
    env_file:
      - .env
    environment:
      DB_HOST: db
      BACKEND_URL: http://127.0.0.1:8001
      DB_PORT: 5432
    volumes:
      - *backend-bind
    depends_on:
      db:
        condition: service_healthy
    command:
      - sh
      - -c
      - >-
        alembic -c /app/alembic.ini upgrade head &&
        python -m scripts.provision_db_credentials &&
        python -m scripts.load_feature_flags &&
        python -m scripts.seed_db
    restart: "no"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    working_dir: /workspace
    command: ["sh", "-c", "pnpm install && pnpm dev --host 0.0.0.0"]
    ports: !override
      - "127.0.0.1:5173:5173"
    volumes: !override
      - type: bind
        source: ./frontend
        target: /workspace
        bind:
          selinux: z
      - frontend_node_modules:/workspace/node_modules
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://127.0.0.1:8001/api/v1}
    networks:
      - backend_net

volumes:
  client_overview_pgdata:
  frontend_node_modules:

networks:
  backend_net:
    driver: bridge
