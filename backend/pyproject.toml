[project]
name = "backend"
version = "0.1.0"
description = "Orbit backend"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "email-validator>=2.3.0",
    "fastapi[standard]>=0.143.0",
    "prometheus-client>=0.26.0",
    "psycopg[binary]>=3.3.6",
    "pwdlib[argon2]>=0.3.1",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.15.0",
    "resend>=2.52.0",
    "sqlalchemy>=2.1.4",
    "google-api-core">=2.44.0,
    "google-api-python-client">=2.201.0,
    "google-apps-meet">=0.5.2,
    "google-auth">=2.62.1,
    "google-auth-httplib2">=0.4.4,
    "google-auth-oauthlib">=1.5.0,
    "googleapis-common-protos">=1.76.0,
]

[dependency-groups]
dev = [
    "faker>=40.43.0",
    "httpx>=0.28.1",
    "httpx2>=2.16.0",
    "mypy>=2.4.0",
    "pytest==9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
]

[tool.uv]
package = false

[tool.coverage.run]
source = ["app"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/migrations/*"
]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
precision = 2
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.14"
explicit_package_bases = true
mypy_path = "."
packages = ["app", "scripts", "tests"]
exclude = ["^.venv/"]

[tool.ruff.lint.isort]
known-first-party = ["app", "scripts"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.params.Depends",
    "Depends",
]
