name: Release & Versioning

on:
  workflow_call:
    inputs:
      publish_mode:
        required: true
        type: string # draft or publish
      target_tag:
        required: false
        type: string
        default: ""
      iteration:
        required: false
        type: string
        default: ""
    secrets:
      PROJECT_TOKEN:
        required: false
    outputs:
      new_tag:
        description: "The newly generated or targeted tag"
        value: ${{ jobs.manage-release.outputs.new_tag }}
      iteration_tag:
        description: "The current iteration as a tag"
        value: ${{ jobs.manage-release.outputs.iteration_tag }}

jobs:
  manage-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      new_tag: ${{ steps.resolve-tag.outputs.tag }}
      iteration_tag: ${{ steps.resolve-iter.outputs.iter_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          fetch-depth: 0

      # DRAFT MODE on push to main
      # calculates the cumulative version bump since the last PUBLISHED tag
      # without pushing a tag, and keeps a single rolling draft release
      - name: Calculate Next Version (Dry Run)
        id: versioning
        if: ${{ inputs.publish_mode == 'draft' }}
        uses: mathieudutour/github-tag-action@af99e60ce8132224b8e6ebab5023449fe256ed46 # v7
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          release_branches: main
          dry_run: true

      - name: Maintain Single Rolling Draft Release
        if: >-
          inputs.publish_mode == 'draft' &&
          steps.versioning.outputs.new_tag != '' &&
          steps.versioning.outputs.new_tag != steps.versioning.outputs.previous_tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_TAG: ${{ steps.versioning.outputs.new_tag }}
          PREV_TAG: ${{ steps.versioning.outputs.previous_tag }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          # remove existing draft so version changes v1.0.1 -> v1.1.0 do not leave orphaned drafts
          EXISTING_DRAFTS=$(gh release list --json tagName,isDraft --jq '.[] | select(.isDraft == true) | .tagName')
          for draft_tag in $EXISTING_DRAFTS; do
            echo "Removing old draft release: $draft_tag"
            gh release delete "$draft_tag" --yes
          done

          # new draft with cumulative notes since the last published tag
          NOTES_ARGS=(--generate-notes)
          if [ -n "$PREV_TAG" ] && git rev-parse "$PREV_TAG" >/dev/null 2>&1; then
            NOTES_ARGS+=(--notes-start-tag "$PREV_TAG")
          fi

          gh release create "$NEW_TAG" \
            --draft \
            --title "Release $NEW_TAG" \
            --target "$TARGET_SHA" \
            "${NOTES_ARGS[@]}"



      # PUBLISH MODE on manual run
      # finds pending draft release (or explicit target_tag), publishes it
      - name: Determine Tag for Manual Release
        id: manual-tag
        if: ${{ inputs.publish_mode == 'publish' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_TAG_INPUT: ${{ inputs.target_tag }}
        run: |
          if [ -n "$TARGET_TAG_INPUT" ]; then
            TARGET="$TARGET_TAG_INPUT"
            echo "Using manually specified tag: $TARGET"
          else
            # find current rolling draft
            TARGET=$(gh release list --json tagName,isDraft --jq '[.[] | select(.isDraft == true)][0].tagName // empty')

            # fallback to latest tag if no draft is waiting
            if [ -z "$TARGET" ]; then
              TARGET=$(git describe --tags --abbrev=0)
              echo "No draft found; falling back to latest git tag: $TARGET"
            else
              echo "Found draft release tag: $TARGET"
            fi
          fi

          echo "target=${TARGET}" >> "$GITHUB_OUTPUT"

      - name: Publish Release
        if: ${{ inputs.publish_mode == 'publish' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET: ${{ steps.manual-tag.outputs.target }}
        run: |
          # if the release already exists; rolling draft, publish it
          if gh release view "$TARGET" >/dev/null 2>&1; then
            echo "Promoting release $TARGET to published..."
            gh release edit "$TARGET" --draft=false --prerelease=false --latest
          else
            echo "Release $TARGET does not exist; creating and publishing..."
            gh release create "$TARGET" \
              --title "Release $TARGET" \
              --target main \
              --generate-notes \
              --latest
          fi

      # Resolve iteration number
      - name: Resolve Iteration Number
        id: resolve-iter
        if: ${{ inputs.publish_mode == 'publish' }}
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN || secrets.GITHUB_TOKEN }}
          ITERATION_INPUT: ${{ inputs.iteration }}
        run: |
          if [ -n "$ITERATION_INPUT" ]; then
            ITER="$ITERATION_INPUT"

          # fetch active iteration via gh cli
          elif command -v gh >/dev/null 2>&1; then
            TODAY_EST=$(TZ="America/New_York" date +%Y-%m-%d)
            echo "current date EST: ${TODAY_EST}"

            QUERY='
            query($org: String!, $num: Int!) {
                organization(login: $org) {
                projectV2(number: $num) {
                    field(name: "Iteration") {
                    ... on ProjectV2IterationField {
                        configuration {
                        iterations {
                            title
                            startDate
                            duration
                        }
                      }
                    }
                  }
                }
              }
            }'

            RAW_DATA=$(gh api graphql -F org="capstone-490" -F num=3 -f query="$QUERY" --jq '
                .data.organization.projectV2.field.configuration.iterations[]
                | [.title, .startDate, (.duration | tostring)]
                | @tsv
            ')

            while IFS=$'\t' read -r title start_date duration; do
                [ -z "$start_date" ] && continue
                END_DATE=$(date -d "${start_date} + ${duration} days" +%Y-%m-%d)

                if [[ ! "$TODAY_EST" < "$start_date" ]] && [[ ! "$TODAY_EST" > "$END_DATE" ]]; then
                  ITER=$(echo "$title" | grep -o -E '[0-9]+' | head -n 1)
                  echo "$title -> resolved $ITER ($start_date to $END_DATE)"
                  break
                fi
            done <<< "$RAW_DATA"
          fi

          if [ -n "$ITER" ]; then
            echo "iter_tag=iteration-${ITER}" >> "$GITHUB_OUTPUT"
            echo "Resolved tag: iteration-${ITER}"
          else
            echo "iter_tag=" >> "$GITHUB_OUTPUT"
            echo "No current iteration matched."
          fi

      - name: Publish Official Release
        if: ${{ inputs.publish_mode == 'publish' }}
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 #v3.0.3
        with:
          tag_name: ${{ steps.manual-tag.outputs.target }}
          name: Release ${{ steps.manual-tag.outputs.target }}
          draft: false
          prerelease: false
          generate_release_notes: true

      - name: Tag and Push Iteration
        if: ${{ inputs.publish_mode == 'publish' && steps.resolve-iter.outputs.iter_tag != '' }}
        env:
          TARGET: ${{ steps.manual-tag.outputs.target }}
          ITER_TAG: ${{ steps.resolve-iter.outputs.iter_tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Fetch tags so the newly published release tag exists locally
          git fetch origin --tags --force

          echo "Tagging commit associated with $TARGET with $ITER_TAG"
          git tag -f "$ITER_TAG" "$TARGET"
          git push origin "$ITER_TAG" --force

      - name: Resolve Output Tag
        id: resolve-tag
        run: |
          if [ "${{ inputs.publish_mode }}" == "draft" ]; then
            echo "tag=${{ steps.versioning.outputs.new_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ steps.manual-tag.outputs.target }}" >> "$GITHUB_OUTPUT"
          fi
