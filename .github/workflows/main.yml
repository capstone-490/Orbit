# Less than 50% AI generated code
name: CI/CD Orchestrator

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

  schedule:
    - cron: "0 22 * * *"

  workflow_dispatch:
    inputs:
      release_type:
        description: "Which release track to publish"
        required: true
        default: "iteration"
        type: choice
        options:
          - "iteration"
          - "milestone"
          - "both"
      target_tag:
        description: "Semantic version tag override (leave blank to auto-calculate)"
        required: false
        type: string
        default: ""
      iteration:
        description: "Iteration or Milestone number override (leave blank to auto-detect)"
        required: false
        type: string
        default: ""

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  detect-changes:
    name: Detect changed files
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.changes.outputs.backend }}
      frontend: ${{ steps.changes.outputs.frontend }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: changes
        with:
          filters: .github/src-filters.yml

  # Both suites run for every PR and push to main.
  # SonarCloud needs both coverage reports for a combined analysis.
  backend-ci:
    needs: detect-changes
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    uses: ./.github/workflows/backend.yml
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      APP_DB_USER: ${{ secrets.APP_DB_USER }}
      APP_DB_PASSWORD: ${{ secrets.APP_DB_PASSWORD }}
      TEST_DB_USER: ${{ secrets.TEST_DB_USER }}
      TEST_DB_PASSWORD: ${{ secrets.TEST_DB_PASSWORD }}

  frontend-ci:
    needs: detect-changes
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    uses: ./.github/workflows/frontend.yml
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  sonar-analysis:
    name: SonarCloud Analysis
    needs: [backend-ci, frontend-ci]
    # Do not expose the Sonar token to pull requests from forks.
    if: >-
      github.event_name == 'push' ||
      (
        github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository
      )
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download Backend Coverage
        uses: actions/download-artifact@v4
        with:
          name: backend-coverage
          path: backend

      - name: Download Frontend Coverage
        uses: actions/download-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage

      - name: Verify Coverage Reports
        run: |
          test -s backend/coverage.xml
          test -s frontend/coverage/lcov.info
          echo "Both coverage reports are present."

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=capstone-490
            -Dsonar.projectKey=capstone-490_Orbit
            -Dsonar.sources=backend/app,frontend/src
            -Dsonar.tests=backend/tests,frontend/src
            -Dsonar.test.inclusions=backend/tests/**/*.py,frontend/src/**/*.test.js,frontend/src/**/*.test.jsx,frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx,frontend/src/**/*.spec.js,frontend/src/**/*.spec.jsx,frontend/src/**/*.spec.ts,frontend/src/**/*.spec.tsx
            -Dsonar.exclusions=**/node_modules/**,**/dist/**,backend/.venv/**,**/coverage/**
            -Dsonar.python.coverage.reportPaths=backend/coverage.xml
            -Dsonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

  auto-tag:
    needs: [backend-ci, frontend-ci]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    uses: ./.github/workflows/release-version.yml
    with:
      publish_mode: "draft"
      release_type: "iteration"
    secrets:
      PROJECT_TOKEN: ${{ secrets.PROJECT_ACCESS_TOKEN }}
    permissions:
      contents: write

  check-release-schedule:
    name: Check Sprint & Milestone Schedule
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      run_iteration: ${{ steps.check.outputs.run_iteration }}
      run_milestone: ${{ steps.check.outputs.run_milestone }}
      iter_num: ${{ steps.check.outputs.iter_num }}
      milestone_num: ${{ steps.check.outputs.milestone_num }}
    steps:
      - name: Determine Release Eligibility
        id: check
        env:
          GH_TOKEN: ${{ secrets.PROJECT_ACCESS_TOKEN || secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_TYPE: ${{ inputs.release_type }}
          DISPATCH_NUM: ${{ inputs.iteration }}
        run: |
          if [ "$EVENT_NAME" == "workflow_dispatch" ]; then
            if [ "$DISPATCH_TYPE" == "iteration" ] || [ "$DISPATCH_TYPE" == "both" ]; then
              echo "run_iteration=true" >> "$GITHUB_OUTPUT"
            else
              echo "run_iteration=false" >> "$GITHUB_OUTPUT"
            fi

            if [ "$DISPATCH_TYPE" == "milestone" ] || [ "$DISPATCH_TYPE" == "both" ]; then
              echo "run_milestone=true" >> "$GITHUB_OUTPUT"
            else
              echo "run_milestone=false" >> "$GITHUB_OUTPUT"
            fi

            echo "iter_num=${DISPATCH_NUM}" >> "$GITHUB_OUTPUT"
            echo "milestone_num=${DISPATCH_NUM}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          TODAY_EST=$(TZ="America/New_York" date +%Y-%m-%d)
          echo "Checking schedule for date EST: ${TODAY_EST}"

          QUERY='
          query($org: String!, $num: Int!) {
            organization(login: $org) {
              projectV2(number: $num) {
                field(name: "Iteration") {
                  ... on ProjectV2IterationField {
                    configuration {
                      iterations {
                        title
                        startDate
                        duration
                      }
                    }
                  }
                }
              }
            }
          }'

          RAW_DATA=$(gh api graphql -F org="capstone-490" -F num=3 -f query="$QUERY" --jq '
            .data.organization.projectV2.field.configuration.iterations[]
            | [.title, .startDate, (.duration | tostring)]
            | @tsv
          ' || true)

          RUN_ITER="false"
          RUN_MILE="false"
          ITER_NUM=""
          MILE_NUM=""

          while IFS=$'\t' read -r title start_date duration; do
            [ -z "$start_date" ] && continue
            END_DATE=$(date -d "${start_date} + $((duration - 1)) days" +%Y-%m-%d)

            if [ "$TODAY_EST" == "$END_DATE" ]; then
              ITER_NUM=$(echo "$title" | grep -o -E '[0-9]+' | head -n 1)
              RUN_ITER="true"
              echo "Today ($TODAY_EST) is the end of $title (iteration-$ITER_NUM)."

              if [[ "$ITER_NUM" == "0" || "$ITER_NUM" == "8" || "$ITER_NUM" == "13" ]]; then
                RUN_MILE="true"
                MILE_NUM=""
                echo "Iteration $ITER_NUM is a Release! Scheduling release-$MILE_NUM."
              fi
              break
            fi
          done <<< "$RAW_DATA"

          echo "run_iteration=${RUN_ITER}" >> "$GITHUB_OUTPUT"
          echo "run_milestone=${RUN_MILE}" >> "$GITHUB_OUTPUT"
          echo "iter_num=${ITER_NUM}" >> "$GITHUB_OUTPUT"
          echo "milestone_num=${MILE_NUM}" >> "$GITHUB_OUTPUT"

  publish-iteration-release:
    needs: check-release-schedule
    if: needs.check-release-schedule.outputs.run_iteration == 'true'
    uses: ./.github/workflows/release-version.yml
    with:
      publish_mode: "publish"
      release_type: "iteration"
      target_tag: ${{ inputs.target_tag || '' }}
      iteration: ${{ needs.check-release-schedule.outputs.iter_num }}
    secrets:
      PROJECT_TOKEN: ${{ secrets.PROJECT_ACCESS_TOKEN }}
    permissions:
      contents: write

  publish-milestone-release:
    needs: check-release-schedule
    if: needs.check-release-schedule.outputs.run_milestone == 'true'
    uses: ./.github/workflows/release-version.yml
    with:
      publish_mode: "publish"
      release_type: "milestone"
      target_tag: ${{ inputs.target_tag || '' }}
      iteration: ${{ needs.check-release-schedule.outputs.milestone_num }}
    secrets:
      PROJECT_TOKEN: ${{ secrets.PROJECT_ACCESS_TOKEN }}
    permissions:
      contents: write
