name: Backend CI

on:
  workflow_call:
    secrets:
      CODECOV_TOKEN:
        required: false
      SONAR_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  test-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: orbit_user
          POSTGRES_PASSWORD: orbit_pssword
          POSTGRES_DB: orbit_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U orbit_user -d orbit_db"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          fetch-depth: 0

      - name: Set up uv & Python
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 #v10.2.0
        with:
          version: "latest"
          working-directory: backend
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install Dependencies
        run: uv sync --frozen
     
      - name: Lint & Formatting (Ruff)
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Static Type Check (Mypy)
        run: uv run mypy .

      - name: Run Migrations & Pytest Coverage
        env:
          DATABASE_URL: postgresql+psycopg://orbit_user:orbit_pssword@127.0.0.1:5432/orbit_db
          DB_NAME: orbit_db
          DB_USER: orbit_user
          DB_PASSWORD: orbit_pssword
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
        run: |
          uv run alembic upgrade head
          uv run pytest --cov=. --cov-report=xml:coverage.xml --cov-report=term-missing
        
      - name: Upload Backend Coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./backend/coverage.xml
          flags: backend
          name: backend-coverage
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

