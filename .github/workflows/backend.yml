# No substantial AI-generated code
name: Backend CI

on:
  workflow_call:
    secrets:
      CODECOV_TOKEN:
        required: false
      SONAR_TOKEN:
        required: false
      POSTGRES_USER:
        required: true
      POSTGRES_PASSWORD:
        required: true
      APP_DB_USER:
        required: true
      APP_DB_PASSWORD:
        required: true
      TEST_DB_USER:
        required: true
      TEST_DB_PASSWORD:
        required: true

permissions:
  contents: read

jobs:
  test-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DB_NAME: orbit_db
      DB_USER: ${{ secrets.TEST_DB_USER }}
      DB_PASSWORD: ${{ secrets.TEST_DB_PASSWORD }}
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      ORBIT_ANONYMIZATION_SECRET: ci-only-anonymization-secret-for-tests
      ORBIT_AUTH_SECRET: ci-only-auth-secret-for-tests-2026
    
    services:
      postgres:
        image: postgres:18.6-alpine3.24
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: orbit_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d orbit_db"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          fetch-depth: 0

      - name: Set up uv & Python
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 #v10.2.0
        with:
          version: "0.9.5"
          working-directory: backend
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install Dependencies
        run: uv sync --frozen --no-build
     
      - name: Lint & Formatting (Ruff)
        run: |
          uv run --locked --no-build ruff check .
          uv run --locked --no-build ruff format --check .

      - name: Static Type Check (Mypy)
        run: uv run --locked --no-build mypy .

      - name: Run Migrations
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: uv run --locked --no-build alembic upgrade head

      - name: Provision Application Database Credentials
        env:
          DB_USER: ${{ secrets.APP_DB_USER }}
          DB_PASSWORD: ${{ secrets.APP_DB_PASSWORD }}
        run: uv run --locked --no-build python -m scripts.provision_db_credentials

      - name: Provision Test Database Credentials
        run: uv run --locked --no-build python -m scripts.provision_db_credentials

      - name: Run Pytest Coverage
        run: uv run --locked --no-build pytest --cov=. --cov-report=xml:coverage.xml --cov-report=term-missing

      - name: Upload Backend Coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./backend/coverage.xml
          flags: backend
          name: backend-coverage
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
