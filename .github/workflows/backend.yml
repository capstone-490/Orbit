# No substantial AI-generated code
name: Backend CI

on:
  workflow_call:
    secrets:
      CODECOV_TOKEN:
        required: false
      SONAR_TOKEN:
        required: false
      POSTGRES_PASSWORD:
        required: true

permissions:
  contents: read

jobs:
  test-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18.6-alpine3.24
        env:
          POSTGRES_USER: orbit_user
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: orbit_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U orbit_user -d orbit_db"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          fetch-depth: 0

      - name: Set up uv & Python
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 #v10.2.0
        with:
          version: "0.9.5"
          working-directory: backend
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install Dependencies
        run: uv sync --frozen --no-build
     
      - name: Lint & Formatting (Ruff)
        run: |
          uv run --locked --no-build ruff check .
          uv run --locked --no-build ruff format --check .

      - name: Static Type Check (Mypy)
        run: uv run --locked --no-build mypy .

      - name: Run Migrations & Pytest Coverage
        env:
          DATABASE_URL: postgresql+psycopg://orbit_user:${{ secrets.POSTGRES_PASSWORD }}@127.0.0.1:5432/orbit_db
          DB_NAME: orbit_db
          DB_USER: orbit_user
          DB_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
        run: |
          # uv run --locked --no-build alembic upgrade head
          uv run --locked --no-build pytest --cov=. --cov-report=xml:coverage.xml --cov-report=term-missing

      - name: Upload Backend Coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./backend/coverage.xml
          flags: backend
          name: backend-coverage
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

   