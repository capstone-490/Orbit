services:
  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    volumes:
      - type: bind
        source: ./prometheus.yml
        target: /etc/prometheus/prometheus.yml
        read_only: true
        bind:
          selinux: z
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - backend
    networks:
      - backend_net

volumes:
  prometheus_data:

