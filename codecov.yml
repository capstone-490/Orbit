coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
      backend:
        target: auto
        flags:
          - backend
      frontend:
        target: auto
        flags:
          - frontend
    patch:
      default:
        target: 60%

flag_management:
  default_rules:
    carryforward: true  # needed since we use paths-filter
  individual_flags:
    - name: backend
      paths:
        - backend/
      carryforward: true
    - name: frontend
      paths:
        - frontend/
      carryforward: true

component_management:
  individual_components:
    - component_id: backend
      name: Backend (Python)
      paths:
        - backend/**
    - component_id: frontend
      name: Frontend (JSX)
      paths:
        - frontend/**

ignore:
  - "poc/**"
  - "deploy/**"
  - "docs/**"
  - "backend/migrations/**"
  - "backend/tests/**"
  - "backend/test/**"
  - "backend/manage.py"
  - "**/*.config.{js,ts,mjs}"
  - "**/*.d.ts"

comment:
  layout: "reach, diff, flags, components, files"
  behavior: default
  require_changes: false # always post the coverage summary on PR
