name: orbit

services:
  db:
    image: postgres:18.6-alpine3.24
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:?Set DB_NAME}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      ORBIT_ANONYMIZATION_SECRET: ${ORBIT_ANONYMIZATION_SECRET:?Set ORBIT_ANONYMIZATION_SECRET in .env}
      ENABLE_DEBUG_ROUTES: ${ENABLE_DEBUG_ROUTES:-false}
      METRICS_ENABLED: ${METRICS_ENABLED:-1}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend_net

  migration:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runtime
    command: ["alembic", "-c", "/app/alembic.ini", "upgrade", "head"]
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend_net
    restart: "no"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runtime
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
    depends_on:
      db:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    networks:
      - backend_net
    restart: unless-stopped
    init: true
    stop_grace_period: 30s

networks:
  backend_net:
    driver: bridge

volumes:
  pgdata:
